services:
  mongodb:
    image: mongo:7
    container_name: app-habitacion-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/${GHCR_OWNER}/app-habitacion-web:${IMAGE_TAG}
    container_name: app-habitacion-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DB}?authSource=admin
      MONGODB_DB: ${MONGODB_DB}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_ROOM_KEY: ${NEXT_PUBLIC_ROOM_KEY:-}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED}
      TZ: ${TZ}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-habitacionesBot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-habitacion-web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.app-habitacion-web.entrypoints=websecure
      - traefik.http.routers.app-habitacion-web.tls=true
      - traefik.http.routers.app-habitacion-web.tls.certresolver=letsencrypt
      - traefik.http.services.app-habitacion-web.loadbalancer.server.port=3000
      - traefik.http.services.app-habitacion-web.loadbalancer.responseforwarding.flushinterval=1s

volumes:
  mongodb_data:
